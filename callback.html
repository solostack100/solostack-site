<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>로그인 확인 · SoloStack</title>
<style>body{margin:0;background:#0c0d10;color:#e8edf2;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;line-height:1.7}main{max-width:720px;margin:0 auto;padding:48px 20px}h1{font-size:1.6rem}code{display:block;word-break:break-all;background:#161a20;padding:12px;border-radius:8px;margin:8px 0}button{padding:8px 14px;border-radius:8px;border:0;background:#2cc4ff;color:#06222d;font-weight:700;cursor:pointer}</style></head><body><main>
<h1>로그인 확인</h1>
<p>이 페이지는 SoloStack 운영자가 자신의 TikTok 계정 로그인 후 돌아오는 주소입니다. 값은 이 브라우저 화면에만 표시되며 서버로 전송되거나 저장되지 않습니다.</p>
<div id="out"></div>
<script>
var p=new URLSearchParams(location.search),o=document.getElementById('out');
if(p.get('code')){
  var v=location.search.substring(1);
  o.innerHTML='<p>아래 내용을 복사해서 운영자에게 전달하세요.</p><code id="v"></code><button onclick="navigator.clipboard.writeText(document.getElementById(\'v\').textContent)">복사</button>';
  document.getElementById('v').textContent=v;
}else if(p.get('error')){
  o.textContent='오류: '+p.get('error')+' '+(p.get('error_description')||'');
}else{o.textContent='표시할 값이 없습니다.';}
history.replaceState(null,'',location.pathname);
</script></main></body></html>
